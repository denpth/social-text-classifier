name: Regression checks
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tensorflow numpy nltk emoji
      - run: python -c "from preprocessing import ensure_resources; ensure_resources()"
      - run: python -m unittest discover -s tests
